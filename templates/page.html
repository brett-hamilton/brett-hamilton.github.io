{% extends "base.html" %}

{% block content %}
<button data-icon-button data-scroll-top data-floating aria-label="Scroll to top">
  {{- load_data(path="static/icons/arrow-up.svg", format="plain") | trim | safe -}}
</button>
<article>
  <header>
    <h1>{{ page.title }}</h1>
    {%- if page.description %}
    <p>{{ page.description }}</p>
    {%- endif %}
  </header>
  <prose-content>{{ page.content | safe }}</prose-content>
</article>
{% endblock content %}
