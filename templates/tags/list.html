{% extends "base.html" %}

{% block content %}
<page-heading>
  <h1>Tags</h1>
  <p>Every tag used across the blog.</p>
</page-heading>
<tag-list>
  {%- for term in terms %}
  <a href="{{ term.permalink | safe }}">#{{ term.name }}<tag-count>{{ term.pages | length }}</tag-count></a>
  {%- endfor %}
</tag-list>
{% endblock content %}
